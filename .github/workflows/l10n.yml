#
# The gettext template must match the t()/n() calls in the code, and
# l10n/*.json + l10n/*.js must match translationfiles/*/*.po. Both are
# generated by scripts/l10n.sh with the Nextcloud translationtool; see
# docs/i18n.md.

name: l10n

on: pull_request

permissions:
  contents: read

concurrency:
  group: l10n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    name: l10n catalogs up to date

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install gettext
        run: |
          command -v xgettext >/dev/null || { sudo apt-get update && sudo apt-get install -y gettext; }
          xgettext --version | head -n 1

      - name: Check the template and the catalogs
        run: scripts/l10n.sh check
