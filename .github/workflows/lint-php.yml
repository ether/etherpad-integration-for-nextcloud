#
# Modeled on https://github.com/nextcloud/notes/blob/main/.github/workflows/lint-php.yml
# Parse-lint every PHP file with the lowest supported PHP toolchain, then
# repeat on the highest to catch version-specific syntax issues.
#
# Which files, and why that set, is in scripts/lint-php.sh - the same
# script a developer can run before pushing, so the two cannot disagree.

name: Lint PHP

# Pushes as well as pull requests: a tag is what gets released, and a
# push to main is what a tag is cut from, so both have to have been
# parsed on the floor before anyone can ship them.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Keyed on github.ref, as every workflow here that can fire on a push
# is: head_ref is empty for one, so a fallback to run_id would hand each
# run its own group and nothing would ever supersede anything.
concurrency:
  group: lint-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-versions }} parse-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: none

      - name: Lint
        # Through bash rather than as an executable: a lost file mode
        # would redden every job with a permission error that reads
        # nothing like a lint.
        run: bash scripts/lint-php.sh
