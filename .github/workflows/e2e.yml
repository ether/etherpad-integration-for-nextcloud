name: e2e

on:
  pull_request:
    # Drafts do not run (see the job's `if`), so ready_for_review has to be
    # here — otherwise marking a PR ready would not start anything.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'js/**'
      - 'templates/**'
      - 'css/**'
      - 'appinfo/**'
      - 'tests/e2e/**'
      # Defines what the stack installs; excluding a runtime path here
      # changes what is tested without touching anything else.
      - 'scripts/app-file-excludes.sh'
      # A Playwright or dotenv bump can break the suite itself, and a CSS
      # regression is exactly what a browser test catches.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    # The suite is slow and talks to a whole stack. The nightly run is what
    # covers every supported major and catches drift in the Nextcloud and
    # Etherpad images; a pull request only pays for the edges. See the
    # matrix below.
    - cron: '0 3 * * *'

# Same as every other workflow here: a read-only token, and no credentials
# left in .git/config while npm, Playwright and Docker run third-party
# content in a PR-triggered job.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Even three container stacks is a lot to spend on work in progress.
    # Keep the PR a draft while iterating; marking it ready starts the run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Nextcloud is the axis that matters, on the Etherpad major the app is
        # written against. Crossing both versions would double the jobs for
        # almost no information — an Etherpad problem looks the same on every
        # Nextcloud.
        #
        # A pull request runs the two ends of the declared range, plus
        # Etherpad 3 on the newest Nextcloud; the majors in between fail the
        # same way as their neighbours, so they wait for the nightly run
        # rather than gating every merge.
        #
        # The Etherpad 3 job blocks like the others: the suite passes against
        # 3.3.3 today, so a red result means something changed, which is
        # exactly what it is for.
        nextcloud: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["31", "34"]' || '["31", "32", "33", "34"]') }}
        etherpad: ['2']
        include:
          # Neither key can be added to an existing combination without
          # overwriting it, so this is one extra job rather than a change to
          # the Etherpad 2 ones.
          - nextcloud: '34'
            etherpad: '3'

    name: Nextcloud ${{ matrix.nextcloud }} + Etherpad ${{ matrix.etherpad }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same source of truth as the node workflow: package.json states the
      # range once, and a major hardcoded here could pin a Node the suite
      # then refuses to run on.
      - name: Read package.json node and npm engines
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3

      # The engines fields are mandatory here, so anything but a version range
      # means the action could not read them. Checked through env rather than
      # interpolated into the script, so a quote in the output cannot end the
      # string it sits in, and against a pattern rather than emptiness, so
      # whitespace does not pass for a version.
      - name: Fail if the engines ranges could not be read
        env:
          NODE_RANGE: ${{ steps.versions.outputs.nodeVersion }}
          NPM_RANGE: ${{ steps.versions.outputs.npmVersion }}
        run: |
          printf '%s' "$NODE_RANGE" | grep -Eq '^[~^]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.node did not read as a version range: '$NODE_RANGE'"; exit 1; }
          printf '%s' "$NPM_RANGE" | grep -Eq '^[~^]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.npm did not read as a version range: '$NPM_RANGE'"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm

      - run: npm ci --engine-strict

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve the stack hostnames
        run: echo '127.0.0.1 nc.pad.test ep.pad.test' | sudo tee -a /etc/hosts

      - name: Bring up Nextcloud ${{ matrix.nextcloud }} + Etherpad ${{ matrix.etherpad }}
        env:
          NC_VERSION: ${{ matrix.nextcloud }}
          EP_VERSION: ${{ matrix.etherpad }}
        run: bash tests/e2e/docker/up.sh

      - name: Run the Playwright suite
        # run-suite.sh wires up the generated env file, the CA for node's
        # fetch, and the browser-side exemption for the per-run CA.
        run: bash tests/e2e/docker/run-suite.sh

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker/compose.yml logs --no-color --tail=400 > stack-logs.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-nc${{ matrix.nextcloud }}-ep${{ matrix.etherpad }}
          path: |
            playwright-report/
            test-results/
            stack-logs.txt
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: docker compose -f tests/e2e/docker/compose.yml down -v --remove-orphans
