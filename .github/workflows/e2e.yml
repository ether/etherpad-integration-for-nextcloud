name: e2e

on:
  pull_request:
    # Drafts do not run (see the job's `if`), so ready_for_review has to be
    # here — otherwise marking a PR ready would not start anything.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'js/**'
      - 'templates/**'
      - 'css/**'
      - 'appinfo/**'
      - 'tests/e2e/**'
      # Defines what the stack installs; excluding a runtime path here
      # changes what is tested without touching anything else.
      - 'scripts/app-file-excludes.sh'
      # A Playwright or dotenv bump can break the suite itself, and a CSS
      # regression is exactly what a browser test catches.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    # The suite talks to a whole stack. The nightly run is what covers every
    # supported major and catches drift in the Nextcloud and Etherpad images,
    # and lets background jobs come due themselves; a pull request only pays
    # for the edges. See the matrix below.
    - cron: '0 3 * * *'

# Same as every other workflow here: a read-only token, and no credentials
# left in .git/config while npm, Playwright and Docker run third-party
# content in a PR-triggered job.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    # Even a few container stacks are a lot to spend on work in progress.
    # Keep the PR a draft while iterating; marking it ready starts the run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: What this run has to do
    # To read how the run of the commit before ended; the jobs that run a
    # pull request's code do not get this.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      slow: ${{ steps.decide.outputs.slow }}
    steps:
      # Two commits: the merge GitHub made, and the base it merges onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide from what changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        # The runner's own Node: the script needs nothing installed.
        run: node tests/e2e/ci-scope.mjs

  e2e:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs the lower bound, the oldest Nextcloud on the
        # oldest Etherpad major, and the upper bound, the newest on the newest:
        # what sits between fails the same way as its neighbours, so it waits
        # for the nightly run rather than loading the shared runners on every
        # push.
        #
        # Nextcloud is the axis that matters at night, on the Etherpad major
        # the app is written against, with Etherpad 3 on the newest.
        stack: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"nextcloud":"32.0.9","etherpad":"2"},{"nextcloud":"35","etherpad":"3"}]'
          || '[{"nextcloud":"32.0.9","etherpad":"2"},{"nextcloud":"33","etherpad":"2"},{"nextcloud":"34","etherpad":"2"},{"nextcloud":"35","etherpad":"2"},{"nextcloud":"35","etherpad":"3"}]') }}
        # Each shard brings up a stack of its own, so tests never share one.
        # Two rather than more: every further one pays for that stack again.
        shard: [1, 2]

    name: Nextcloud ${{ matrix.stack.nextcloud }} + Etherpad ${{ matrix.stack.etherpad }} (${{ matrix.shard }}/2)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same source of truth as the node workflow: package.json states the
      # range once, and a major hardcoded here could pin a Node the suite
      # then refuses to run on.
      - name: Read package.json node and npm engines
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4

      # The engines fields are mandatory here, so anything but a version range
      # means the action could not read them. Checked through env rather than
      # interpolated into the script, so a quote in the output cannot end the
      # string it sits in, and against a pattern rather than emptiness, so
      # whitespace does not pass for a version.
      - name: Fail if the engines ranges could not be read
        env:
          NODE_RANGE: ${{ steps.versions.outputs.nodeVersion }}
          NPM_RANGE: ${{ steps.versions.outputs.npmVersion }}
        run: |
          printf '%s' "$NODE_RANGE" | grep -Eq '^[~^]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.node did not read as a version range: '$NODE_RANGE'"; exit 1; }
          printf '%s' "$NPM_RANGE" | grep -Eq '^[~^]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.npm did not read as a version range: '$NPM_RANGE'"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm

      - run: npm ci --engine-strict

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve the stack hostnames
        run: echo '127.0.0.1 nc.pad.test ep.pad.test' | sudo tee -a /etc/hosts

      - name: Bring up Nextcloud ${{ matrix.stack.nextcloud }} + Etherpad ${{ matrix.stack.etherpad }}
        env:
          NC_VERSION: ${{ matrix.stack.nextcloud }}
          EP_VERSION: ${{ matrix.stack.etherpad }}
        run: bash tests/e2e/docker/up.sh

      # Cheap, and it guards a property no unit test can: the declaration in
      # lib/Util/SensitiveMethods.php only has an effect inside a running
      # Nextcloud, through its own exception serializer.
      - name: Check that secrets stay out of the log
        if: matrix.shard == 1
        run: bash tests/e2e/docker/test-log-secrets.sh

      - name: Run the Playwright suite
        id: suite
        # run-suite.sh wires up the generated env file, the CA for node's
        # fetch, and the browser-side exemption for the per-run CA.
        env:
          SHARD: ${{ matrix.shard }}
          SLOW: ${{ needs.decide.outputs.slow }}
          E2E_REAL_JOB_WAIT: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          args=("--shard=$SHARD/2")
          if [[ "$SLOW" != true ]]; then
            args+=(--grep-invert @slow)
          fi
          bash tests/e2e/docker/run-suite.sh "${args[@]}"

      # What Nextcloud and its other apps logged in the browser fails no
      # test; grouped on the run's page, the noise a new release brings
      # shows without downloading a report. Whenever the suite ran, green
      # or red.
      - name: Summarise the browser noise of other software
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        # It informs; it does not judge a run the suite already judged.
        continue-on-error: true
        # Into the log too: the summary page shows only to someone signed
        # in, the log also to the API.
        run: node tests/e2e/browser-noise-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Where the time goes, on green runs too: what to look at before making
      # the suite faster, and how the stacks differ.
      - name: Summarise the slowest tests
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        continue-on-error: true
        run: node tests/e2e/slowest-tests.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        with:
          name: e2e-times-nc${{ matrix.stack.nextcloud }}-ep${{ matrix.stack.etherpad }}-${{ matrix.shard }}
          path: e2e-results.json
          retention-days: 7

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker/compose.yml logs --no-color --tail=400 > stack-logs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-nc${{ matrix.stack.nextcloud }}-ep${{ matrix.stack.etherpad }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            stack-logs.txt
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: docker compose -f tests/e2e/docker/compose.yml down -v --remove-orphans
