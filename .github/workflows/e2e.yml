name: e2e

on:
  pull_request:
    # Drafts do not run (see the job's `if`), so ready_for_review has to be
    # here — otherwise marking a PR ready would not start anything.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'js/**'
      - 'templates/**'
      - 'css/**'
      - 'appinfo/**'
      - 'tests/e2e/**'
      # Defines what the stack installs; excluding a runtime path here
      # changes what is tested without touching anything else.
      - 'scripts/app-file-excludes.sh'
      # A Playwright or dotenv bump can break the suite itself, and a CSS
      # regression is exactly what a browser test catches.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    # The suite is slow and talks to a whole stack; a nightly run catches
    # drift in the Nextcloud and Etherpad images without gating every PR
    # on all three majors.
    - cron: '0 3 * * *'

# Same as every other workflow here: a read-only token, and no credentials
# left in .git/config while npm, Playwright and Docker run third-party
# content in a PR-triggered job.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Three container stacks per run is a lot to spend on work in progress.
    # Keep the PR a draft while iterating; marking it ready starts the run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The range appinfo/info.xml declares support for.
        nextcloud: ['31', '32', '33']

    name: Nextcloud ${{ matrix.nextcloud }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve the stack hostnames
        run: echo '127.0.0.1 nc.pad.test ep.pad.test' | sudo tee -a /etc/hosts

      - name: Bring up Nextcloud ${{ matrix.nextcloud }} + Etherpad
        env:
          NC_VERSION: ${{ matrix.nextcloud }}
        run: bash tests/e2e/docker/up.sh

      - name: Run the Playwright suite
        # run-suite.sh wires up the generated env file, the CA for node's
        # fetch, and the browser-side exemption for the per-run CA.
        run: bash tests/e2e/docker/run-suite.sh

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker/compose.yml logs --no-color --tail=400 > stack-logs.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-nc${{ matrix.nextcloud }}
          path: |
            playwright-report/
            test-results/
            stack-logs.txt
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: docker compose -f tests/e2e/docker/compose.yml down -v --remove-orphans
