#
# Modeled on https://github.com/nextcloud/notes/blob/main/.github/workflows/phpunit.yml
# The test suite is stub-based (see tests/phpunit/bootstrap.php), so no real
# Nextcloud server is required — only a PHP toolchain with composer.

name: PHPUnit

on: pull_request

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/phpunit.yml'
              - 'composer.*'
              - 'lib/**'
              - 'tests/phpunit/**'
              - 'phpunit.xml.dist'
              # PadFileTypeLiteralsTest walks its SCANNED list for a MIME
              # type written out by hand, and PadAccessModeTest reads
              # src/lib/constants.js. These entries are that list.
              - 'src/**'
              - 'templates/**'
              - 'appinfo/**'

  phpunit:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-versions }} unit tests

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-versions }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer test:phpunit

  # appinfo/info.xml declares 8.1 as the floor and the installed toolchain
  # cannot run there, because PHPUnit 11 requires 8.2. A pinned PHPUnit 10
  # PHAR can, so this job is what keeps the declared floor from being a claim
  # nothing checks.
  phpunit-floor:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: PHP 8.1 unit tests

    env:
      PHPUNIT_PHAR_VERSION: 10.5.45
      # Signed by the PHPUnit release key; re-derive with sha256sum after a bump.
      PHPUNIT_PHAR_SHA256: 8db3e6db1e713cd49deb2af697e83b0160839f263a2246bae50af5c9992c21e4

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.1-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.1-

      # Resolves against composer.json's config.platform (8.2.27), not the
      # 8.1 runner, so this installs the same tree as the other jobs. What is
      # being tested here is the interpreter, not the dependency set.
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Fetch PHPUnit 10
        run: |
          curl -sSLf -o phpunit.phar \
            "https://phar.phpunit.de/phpunit-${PHPUNIT_PHAR_VERSION}.phar"
          echo "${PHPUNIT_PHAR_SHA256}  phpunit.phar" | sha256sum --check --strict -

      - name: Run PHPUnit
        run: php phpunit.phar --testsuite unit

  summary:
    runs-on: ubuntu-latest
    needs: [phpunit, phpunit-floor]
    if: always()

    name: phpunit-summary

    steps:
      - run: |
          for result in "${{ needs.phpunit.result }}" "${{ needs.phpunit-floor.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done
