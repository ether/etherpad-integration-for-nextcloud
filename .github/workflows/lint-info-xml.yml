# Modeled on https://github.com/nextcloud/notes/blob/main/.github/workflows/lint-info-xml.yml
# Validates appinfo/info.xml against the published apps.nextcloud.com schema.

name: Lint info.xml

on: pull_request

permissions:
  contents: read

concurrency:
  group: lint-info-xml-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  xml-linters:
    runs-on: ubuntu-latest

    name: info.xml lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download schema
        run: wget --quiet https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd

      - name: Lint info.xml
        uses: ChristophWurst/xmllint-action@36f2a302f84f8c83fceea0b9c59e1eb4a616d3c1 # v1.2
        with:
          xml-file: ./appinfo/info.xml
          xml-schema-file: ./info.xsd

  version-consistency:
    runs-on: ubuntu-latest

    name: version consistency

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # appinfo/info.xml is the single source of truth for the app version.
      # package.json / package-lock.json are aligned manually, so guard against
      # drift (#119): fail the build if they disagree. The release workflow
      # runs the same check, since a tag can sit on a commit no pull request
      # ever saw.
      - name: Compare info.xml and the versions everything else restates
        run: python3 scripts/check-version-alignment.py

      # The same argument for the supported Nextcloud range: info.xml declares
      # it and eight other files restate it.
      - name: Compare info.xml and the Nextcloud range everything else assumes
        run: python3 scripts/check-nextcloud-range.py

      # And for the PHP range, which the two test workflows restate as
      # literals.
      - name: Compare info.xml and the PHP range the workflows test
        run: python3 scripts/check-php-range.py
