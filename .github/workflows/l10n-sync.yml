#
# translatewiki.net commits translationfiles/<lang>/etherpad_nextcloud.po
# to main. Nextcloud reads l10n/<lang>.json + .js, so this rebuilds them
# with scripts/l10n.sh convert and opens (or refreshes) a pull request.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings. A pull request opened with GITHUB_TOKEN
# does not start other workflows, so close and reopen it (or push to it)
# to run the required checks before merging.

name: l10n sync

on:
  push:
    branches: [main]
    paths:
      - 'translationfiles/*/*.po'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l10n-sync
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH: l10n/translatewiki-sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install gettext
        run: command -v xgettext >/dev/null || { sudo apt-get update && sudo apt-get install -y gettext; }

      - name: Rebuild l10n/
        run: scripts/l10n.sh convert

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- l10n)" ]; then
            echo "l10n/ already matches translationfiles/."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -A l10n
          git commit -m 'chore(l10n): rebuild catalogs from translatewiki.net'
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(l10n): rebuild catalogs from translatewiki.net' \
              --body 'Generated by the l10n sync workflow from the .po files translatewiki.net committed. Close and reopen to run CI.'
          fi
