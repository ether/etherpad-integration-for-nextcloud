#
# Modeled on https://github.com/nextcloud/notes/blob/main/.github/workflows/node.yml
# Runs vitest plus a production build to catch regressions in the frontend bundle.

name: Node

on: pull_request

permissions:
  contents: read

concurrency:
  group: node-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/node.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'src/**'
              - 'js/**'
              - 'tests/js/**'

  build-and-test:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: npm build + vitest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3

      # The engines fields are mandatory here, so an empty output means the
      # action could not read them. Failing on the spot names the cause; the
      # alternative is a Node chosen from a stale default and an install that
      # rejects it three steps later.
      - name: Fail if the engines range could not be read
        run: |
          test -n '${{ steps.versions.outputs.nodeVersion }}' || { echo '::error::could not read engines.node from package.json'; exit 1; }
          test -n '${{ steps.versions.outputs.npmVersion }}' || { echo '::error::could not read engines.npm from package.json'; exit 1; }

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Fail if built assets are stale
        # The committed js/ bundles must match a fresh build of src/.
        # Use `git status --porcelain` (not `git diff`) so a brand-new,
        # still-untracked chunk/entry point also fails the check.
        # If this fails, run `npm run build` locally and commit js/.
        run: |
          changes="$(git status --porcelain -- js/)"
          if [ -n "$changes" ]; then
            echo "Built js/ assets are out of date with src/. Run 'npm run build' and commit js/:" >&2
            echo "$changes" >&2
            exit 1
          fi
