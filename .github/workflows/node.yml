#
# Modeled on https://github.com/nextcloud/notes/blob/main/.github/workflows/node.yml
# Runs vitest plus a production build to catch regressions in the frontend bundle.

name: Node

on: pull_request

permissions:
  contents: read

concurrency:
  group: node-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/node.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'src/**'
              - 'js/**'
              - 'tests/js/**'

  build-and-test:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: npm build + vitest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3

      # The engines fields are mandatory here, so anything but a version range
      # means the action could not read them. Checked through env rather than
      # interpolated into the script, so a quote in the output cannot end the
      # string it sits in, and against a pattern rather than emptiness, so
      # whitespace does not pass for a version.
      - name: Fail if the engines ranges could not be read
        env:
          NODE_RANGE: ${{ steps.versions.outputs.nodeVersion }}
          NPM_RANGE: ${{ steps.versions.outputs.npmVersion }}
        run: |
          printf '%s' "$NODE_RANGE" | grep -Eq '^[\^~]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.node did not read as a version range: '$NODE_RANGE'"; exit 1; }
          printf '%s' "$NPM_RANGE" | grep -Eq '^[\^~]?[0-9]+(\.[0-9]+){0,2}$' \
            || { echo "::error::engines.npm did not read as a version range: '$NPM_RANGE'"; exit 1; }

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Run vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Fail if built assets are stale
        # The committed js/ bundles must match a fresh build of src/.
        # Use `git status --porcelain` (not `git diff`) so a brand-new,
        # still-untracked chunk/entry point also fails the check.
        # If this fails, run `npm run build` locally and commit js/.
        run: |
          changes="$(git status --porcelain -- js/)"
          if [ -n "$changes" ]; then
            echo "Built js/ assets are out of date with src/. Run 'npm run build' and commit js/:" >&2
            echo "$changes" >&2
            exit 1
          fi
