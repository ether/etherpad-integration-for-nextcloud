#
# Turns a pushed v* tag into a GitHub release with the app tarball attached.
# The tarball itself is built by scripts/build-release-tarball.sh, the same
# script a maintainer runs locally, so the released artefact and a local one
# are built the same way.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the tarball and publish the release
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading the tarball.
      contents: write

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tarball is named from appinfo/info.xml, and the release from the
      # tag. A tag that disagrees would publish etherpad_nextcloud-<a>.tar.gz
      # under v<b>, so it is refused here rather than shipped.
      - name: Read the version and check it against the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep -oE '<version>[^<]+</version>' appinfo/info.xml | sed -E 's|</?version>||g' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::could not read <version> from appinfo/info.xml"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match appinfo/info.xml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Semver says everything after the first hyphen is a pre-release.
          case "$version" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Read package.json node and npm engines
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Production build
        run: npm run build

      # The committed js/ ships in the tarball, and the eight js/*.license
      # files carry the app version - so a tag placed without rebuilding
      # would release bundles that name the previous version.
      - name: Fail if built assets are stale
        run: |
          changes="$(git status --porcelain -- js/)"
          if [ -n "$changes" ]; then
            echo "::error::built js/ assets are out of date with src/ at this tag"
            echo "$changes" >&2
            exit 1
          fi

      # The tarball excludes vendor/ (scripts/app-file-excludes.sh), which is
      # correct while composer.json requires nothing at runtime. The day it
      # does, that exclusion and this workflow both need a decision - so the
      # release stops here rather than shipping an app without its dependency.
      - name: Fail if a runtime dependency appeared
        run: |
          requires="$(python3 -c "import json; print(' '.join(k for k in json.load(open('composer.json')).get('require', {}) if k != 'php'))")"
          if [ -n "$requires" ]; then
            echo "::error::composer.json now requires $requires at runtime, but the tarball excludes vendor/"
            exit 1
          fi

      - name: Build the release tarball
        run: scripts/build-release-tarball.sh dist

      # A release usually gets prose written for its readers, which is not the
      # same text as the CHANGELOG entry - that one is terse and carries issue
      # numbers. Where it exists it wins; where nobody wrote one the CHANGELOG
      # section still makes a release that says something.
      - name: Collect the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          written="docs/release-notes/$VERSION.md"
          if [ -f "$written" ]; then
            echo "Using $written"
            cp "$written" release-notes.md
          else
            echo "No $written; using the CHANGELOG section"
            scripts/changelog-section.py "$VERSION" > release-notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=''
          if [ "$PRERELEASE" = 'true' ]; then
            flags='--prerelease'
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" "dist/etherpad_nextcloud-$VERSION.tar.gz" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            $flags
