#
# Mutation testing of the lines a pull request changes in lib/, with
# Infection (infection.json5): a change to the code that no unit test
# notices is reported, not refused, and the job fails only when Infection
# cannot run. Lines with an escaped mutant, and lines no test runs, are
# annotated; GitHub turns the first ten warnings of a step into
# annotations, and the job summary and the log artifact list every one.
#
# Infection 0.35 needs PHP 8.3 or later, above composer.json's platform,
# so it comes as a pinned PHAR rather than a dev dependency.

name: Infection

on: pull_request

permissions:
  contents: read

concurrency:
  group: infection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/infection.yml'
              - 'infection.json5'
              - 'phpunit.xml.dist'
              - 'composer.*'
              - 'lib/**'
              - 'tests/phpunit/**'

  infection:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: Mutation testing of the changed lines

    env:
      INFECTION_PHAR_VERSION: 0.35.5
      # The digest GitHub lists for the release asset; re-derive with
      # sha256sum after a bump.
      INFECTION_PHAR_SHA256: 61720c27c24315d307b398467d20b6a29097434a7f14e17914fcd500052b68f7

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch too: the changed lines are a diff against it.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.4-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Fetch Infection
        run: |
          curl -sSLf -o "$RUNNER_TEMP/infection.phar" \
            "https://github.com/infection/infection/releases/download/${INFECTION_PHAR_VERSION}/infection.phar"
          echo "${INFECTION_PHAR_SHA256}  $RUNNER_TEMP/infection.phar" | sha256sum --check --strict -

      # Infection takes added and modified files only. With rename detection
      # a file a pull request moves and edits is a rename, and its changed
      # lines would go untested; without it a moved file is a new one, and
      # all its lines are mutated.
      - name: Diff without rename detection
        run: git config diff.renames false

      # --with-uncovered mutates lines no test runs too, which Infection
      # otherwise leaves out: a new method without a test would show
      # nothing.
      - name: Run Infection on the changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          php "$RUNNER_TEMP/infection.phar" \
            --git-diff-lines --git-diff-base="origin/$BASE_REF" \
            --with-uncovered \
            --threads=max --no-interaction \
            --logger-github \
            --logger-text="$RUNNER_TEMP/infection.log"

      # Infection annotates escaped mutants only, so a line no test runs
      # would show less than one a test runs weakly. One annotation for each
      # file, at its first such line, naming all of them.
      - name: Annotate the lines no test runs
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/infection.log" ] || exit 0
          sed -n '/^Not Covered mutants:$/,/^[A-Z][A-Za-z ]* mutants:$/p' "$RUNNER_TEMP/infection.log" \
            | sed -nE "s#^[0-9]+\) ${GITHUB_WORKSPACE}/([^:]+):([0-9]+) .*#\1 \2#p" \
            | sort -u -k1,1 -k2,2n \
            | awk '$1 != file { if (file != "") print file, first, lines; file = $1; first = $2; lines = $2; next }
                { lines = lines ", " $2 }
                END { if (file != "") print file, first, lines }' \
            | while read -r file first lines; do
                echo "::warning file=${file},line=${first}::No test runs these lines: ${lines}. No mutant Infection made on them could be caught."
              done

      # The log holds the pull request's own code in the mutants' diffs, so
      # the fence is longer than any run of backticks in it. A step's summary
      # is dropped whole above 1 MiB, so it takes the log's first 900000
      # bytes; the artifact below holds all of it.
      - name: Write the result to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Mutation testing of the changed lines'
            echo
            if [ -s "$RUNNER_TEMP/infection.log" ]; then
              head -c 900000 "$RUNNER_TEMP/infection.log" > "$RUNNER_TEMP/infection-summary.log"
              longest="$(grep -o '`*' "$RUNNER_TEMP/infection-summary.log" | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
              fence="$(printf '%*s' "$(( longest < 3 ? 3 : longest + 1 ))" '' | tr ' ' '`')"
              echo "$fence"
              cat "$RUNNER_TEMP/infection-summary.log"
              echo
              echo "$fence"
              if [ "$(wc -c < "$RUNNER_TEMP/infection.log")" -gt 900000 ]; then
                echo
                echo 'The log goes on: the artifact infection-log holds all of it.'
              fi
            else
              echo 'No mutants: the pull request changes no line Infection mutates, or Infection did not finish.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-log
          path: ${{ runner.temp }}/infection.log
          if-no-files-found: ignore
          retention-days: 7
