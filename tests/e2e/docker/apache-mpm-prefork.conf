#
# Enough idle workers for one page load. The image's stock prefork pool
# keeps 5 to 10 of them, and a Files page asks for two to three hundred
# files at once: past the idle ones, Apache starts new workers a second
# apart - one, two, four - and single scripts wait up to four seconds for
# their first byte. That happens to whichever page load follows a quiet
# stretch, a block of API-only specs say, and a suite that waits on what a
# page does once its scripts ran then fails for a reason that is the
# stack's, not the app's.
<IfModule mpm_prefork_module>
	StartServers            96
	MinSpareServers         96
	MaxSpareServers         150
	ServerLimit             256
	MaxRequestWorkers       256
	MaxConnectionsPerChild  0
</IfModule>
