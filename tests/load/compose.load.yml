#
# Laid over tests/e2e/docker/compose.yml for the load stack.
#
# Etherpad logs each call of its API only at debug level, and that log is
# how the load scripts count what the app asks of it. Its database lives
# in the container, so the container has to get this before any pad is
# made.
#
# Redis takes Nextcloud's file locks and its distributed cache, as the
# admin manual recommends for an instance under load; without it the locks
# sit in the database, where concurrent syncs deadlock on them. Postgres
# takes more connections than Apache has workers (256, see
# apache-mpm-prefork.conf): with its default of 100, the requests past
# that fail with a 500 before the app is reached. README.md says how to
# point Nextcloud at Redis.

services:
  etherpad:
    environment:
      LOGLEVEL: DEBUG

  db:
    command: ["postgres", "-c", "max_connections=300"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
